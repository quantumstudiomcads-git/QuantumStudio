name: Validate

on:
  push:
    branches: [beta-hardening-v0.2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python scripts/build_windows.py --dry-run
      - run: python scripts/build_linux_appimage.py --dry-run
