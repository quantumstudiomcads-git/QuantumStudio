# LOCAL DEVELOPMENT ONLY. Do not add pages_build_output_dir here: that opts this
# file into deployed Pages configuration and overrides dashboard-managed settings.
# Pages build/runtime variables and real D1 bindings belong to the matching Pages
# project's dashboard environment. No deployment environment is selected here.
# npm run pages:dev supplies the local build directory explicitly.
name = "quantum-studio-website"
compatibility_date = "2026-09-20"
send_metrics = false

# Local-only D1 identity for wrangler pages dev and d1:migrate:local.
# Never replace this with a staging/production database ID in tracked configuration.
[[d1_databases]]
binding = "BETA_DB"
database_name = "quantum-studio-beta"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
